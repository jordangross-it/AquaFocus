<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand" />
  <link rel="icon" type="image/png" href="images/AquaFocus1.png" />

  <script src="https://kit.fontawesome.com/3fa12e31f9.js" crossorigin="anonymous"></script>
  <script src="scripts.js" defer></script>

  <title>Contact | AquaFocus</title>
</head>

<body>
  <div class="container">
    <nav class="navigation">
      <div class="logo"><a href="https://jordangross-it.github.io/AquaFocus/">AquaFocus</a></div>
      <div class="hamburger" id="hamburger-icon">
        &#9776; </div>
      <div class="nav-links" id="nav-menu">
        <a href="https://jordangross-it.github.io/AquaFocus/index.html#features">Features</a>
        <a href="https://jordangross-it.github.io/AquaFocus/index.html#download">Download</a>
        <a href="https://jordangross-it.github.io/AquaFocus/contact.html">Contact</a>
      </div>
    </nav>

    <div class="contact-header">
      <h1>Contact Us</h1>
      <p>We'd love to hear from you! Whether you have questions, feedback, or just want to say hello, feel free to reach
        out.</p>
    </div>

    <div class="contact-form">
      <form action="https://formspree.io/f/mdkznzry" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your Name" required=""><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Your Email" required=""><br>
        <label for="message">Message:</label>
        <textarea id="message" rows="6" placeholder="Your Message" required=""></textarea><br>
        <button type="submit">Send Message</button>
      </form>
    </div>

    <footer>
      <p>&copy; 2025 AquaFocus. All rights reserved.</p>
    </footer>

  </div>

  <button id="backToTop" title="Go to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</body>

</html>
